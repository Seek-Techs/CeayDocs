name: Quality Gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff mypy bandit

      - name: Ruff
        ruff check . --fix
        ruff format .
        ruff check .

      - name: Mypy
        run: mypy --explicit-package-bases .

      - name: Bandit
        run: bandit -r core services utils api models

      - name: Tests + Coverage
        run: |
          pytest \
            --cov=core \
            --cov=services \
            --cov=utils \
            --cov=api \
            --cov=models \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80


