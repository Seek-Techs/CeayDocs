name: Quality Gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff mypy bandit

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Bandit
        run: bandit -r core services utils api models

      - name: Tests + coverage
        run: |
          pytest -q --disable-warnings --maxfail=1 --cov=core --cov=services --cov=utils --cov=api --cov=models --cov-fail-under=80


